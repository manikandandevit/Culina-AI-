{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syngrid AI - Your Cooking Assistant</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'chat_app/style.css' %}">
</head>
<body>
    <!-- Animated Background -->
    <div class="animated-background">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
        <div class="particles"></div>
    </div>

    <div class="chat-container">
        <!-- Header with Logo -->
        <div class="chat-header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="company-logo">
                    <div class="logo-inner">
                        <i class="fas fa-utensils"></i>
                    </div>
                        <div class="logo-pulse"></div>
                    </div>
                    <div class="header-text">
                        <h1>Culina AI</h1>
                        <p class="subtitle">Your Cooking Assistant</p>
                    </div>
                </div>
                <div class="status-indicator">
                    <div class="status-dot"></div>
                    <span class="status-text">Online</span>
                </div>
            </div>
        </div>

        <!-- Chat Messages Area -->
        <div id="chat-box" class="chat-box">
            <div class="chat-overlay"></div>
        </div>

        <!-- Input Area -->
        <div class="chat-input-container">
            <div class="input-wrapper">
                <input type="text" id="user-input" class="chat-input" placeholder="Ask me about recipes, cooking tips, or meal ideas..." onkeypress="handleKeyPress(event)">
                <div class="input-icon">
                    <i class="fas fa-comment-dots"></i>
                </div>
                <button class="send-button" onclick="sendMessage()" id="send-btn">
                    <i class="fas fa-paper-plane"></i>
                    <div class="button-ripple"></div>
                </button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="{% static 'chat_app/script.js' %}"></script>
</body>
</html>
